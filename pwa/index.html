<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rekap Sales</title>
<meta name="description" content="Catat dan rekap penjualan, data tersimpan di Google Sheets.">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rekap Sales">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1b1f2a; --muted: #667085;
    --primary: #1a73e8; --on-primary: #ffffff; --soft: #e8f0fe; --border: #e4e7ec;
    --danger: #d92d20; --shadow: 0 1px 3px rgba(16, 24, 40, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131a; --card: #1a1f2b; --text: #eceff5; --muted: #9aa4b5;
      --primary: #8ab4f8; --on-primary: #0b1220; --soft: #1f2a44; --border: #2a3140;
      --danger: #f97066; --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 640px; margin: 0 auto; padding: 0 16px calc(160px + env(safe-area-inset-bottom)); }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 8px; }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  .monthbar { display: flex; align-items: center; justify-content: space-between; }
  .monthbar b { font-size: 16px; }

  button { font: inherit; color: inherit; cursor: pointer; }
  .icon { background: none; border: 0; padding: 8px 10px; border-radius: 8px; font-size: 18px; line-height: 1; }
  .icon:active { background: var(--soft); }
  .btn { background: var(--primary); color: var(--on-primary); border: 0; border-radius: 10px;
    padding: 10px 18px; font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--primary); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .5; }

  .card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
    border: 1px solid var(--border); padding: 12px 14px; margin: 0 0 8px; }
  .summary { background: var(--soft); border-color: transparent; padding: 16px; margin-bottom: 12px; }
  .summary .lbl { font-size: 13px; color: var(--muted); }
  .summary .big { font-size: 26px; font-weight: 700; margin: 2px 0; }
  .item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .item .grow { flex: 1; min-width: 0; }
  .item .t { font-weight: 600; overflow-wrap: anywhere; }
  .item .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .item .amt { font-weight: 700; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); padding: 36px 8px; }
  .hint { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
  #view.busy { opacity: .5; transition: opacity .15s; }

  h3 { margin: 18px 0 8px; font-size: 16px; }
  .bar-row { margin-bottom: 12px; }
  .bar-row .top { display: flex; justify-content: space-between; gap: 8px; }
  .bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; margin: 4px 0; }
  .bar i { display: block; height: 100%; background: var(--primary); border-radius: 4px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card);
    border-top: 1px solid var(--border); display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom); }
  nav .in { display: flex; width: 100%; max-width: 640px; }
  nav button { flex: 1; background: none; border: 0; padding: 8px 0 10px; font-size: 12px; color: var(--muted); }
  nav button span { display: block; font-size: 20px; }
  nav button[aria-current="page"] { color: var(--primary); font-weight: 700; }

  .fab { position: fixed; z-index: 6; right: max(16px, calc((100vw - 640px) / 2 + 16px));
    bottom: calc(80px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 16px;
    border: 0; background: var(--primary); color: var(--on-primary); font-size: 30px; line-height: 1;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .3); display: none; align-items: center; justify-content: center; }

  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .45);
    display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 18px; } }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  input { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  .row { display: flex; gap: 10px; } .row label { flex: 1; }
  .total { margin: 4px 0 8px; font-size: 16px; }
  .err { color: var(--danger); min-height: 1.2em; margin: 4px 0; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #323232; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 30;
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: .95; }

  .toprow { display: flex; align-items: center; justify-content: space-between; }
  .toprow h1 { margin: 0 0 4px; }
  .toprow .acts { display: flex; align-items: center; gap: 4px; }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .banner { background: #fff4e5; color: #7a4b00; border-radius: 10px; padding: 8px 12px;
    margin-bottom: 12px; font-size: 13px; }
  @media (prefers-color-scheme: dark) { .banner { background: #3a2c10; color: #ffd591; } }
  .help { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

  .item.top { align-items: flex-start; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .lines { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; }
  .lines li { display: flex; justify-content: space-between; gap: 8px; }
  .lines li span:first-child { overflow-wrap: anywhere; }
  .lines li span:last-child { color: var(--muted); white-space: nowrap; }
  .sec { font-weight: 600; margin: 4px 0 8px; }
  .line { border: 1px solid var(--border); border-radius: 12px; padding: 2px 12px 10px; margin-bottom: 10px; }
  .line label { margin-bottom: 8px; }
  .lhead { display: flex; align-items: center; justify-content: space-between; }
  .line .sub { text-align: right; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header id="top"></header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Tambah">+</button>
<nav><div class="in" id="nav"></div></nav>
<div id="modal-root"></div>
<div id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  var MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus',
                'September', 'Oktober', 'November', 'Desember'];
  var TABS = [
    { id: 'sales', label: 'Penjualan', icon: '🧾' },
    { id: 'products', label: 'Produk', icon: '📦' },
    { id: 'outlets', label: 'Outlet', icon: '🏪' },
    { id: 'recap', label: 'Rekap', icon: '📊' }
  ];

  var state = { tab: 'sales', month: ym(new Date()), data: null, error: null, busy: false,
                offlineAt: 0, loadedAt: 0 };
  var installEvt = null;
  var seq = 0;

  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ym(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function today() { var d = new Date(); return ym(d) + '-' + pad(d.getDate()); }
  function shiftMonth(m, delta) {
    var p = m.split('-');
    return ym(new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1));
  }
  function monthLabel(m) { var p = m.split('-'); return MONTHS[Number(p[1]) - 1] + ' ' + p[0]; }
  function fmtDate(s) { var p = s.split('-'); return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1].slice(0, 3) + ' ' + p[0]; }
  function rp(n) { return 'Rp ' + Number(n || 0).toLocaleString('id-ID'); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function errMsg(e) {
    var m = (e && e.message) ? e.message : String(e);
    return m === 'NETWORK'
      ? 'Tidak bisa terhubung ke server. Periksa koneksi internet (atau pastikan deploy Web app memakai akses "Anyone").'
      : m;
  }

  var CFG_KEY = 'rs-config';
  var memCfg = null;
  function getCfg() {
    if (memCfg) return memCfg;
    try {
      var c = JSON.parse(localStorage.getItem(CFG_KEY));
      return c && c.url && c.token ? c : null;
    } catch (e) { return null; }
  }
  function setCfg(c) {
    memCfg = c;
    try { if (c) localStorage.setItem(CFG_KEY, JSON.stringify(c)); else localStorage.removeItem(CFG_KEY); } catch (e) {}
  }
  function clearCache() {
    try {
      Object.keys(localStorage).forEach(function (k) { if (k.indexOf('rs-cache-') === 0) localStorage.removeItem(k); });
    } catch (e) {}
  }
  function cacheKey(m) { return 'rs-cache-' + m; }
  function readCache(m) {
    try {
      var c = JSON.parse(localStorage.getItem(cacheKey(m)));
      return c && c.data && Array.isArray(c.data.notas) && c.data.notas.every(function (n) { return Array.isArray(n.items); }) ? c : null;
    } catch (e) { return null; }
  }
  function writeCache(m, d) {
    try { localStorage.setItem(cacheKey(m), JSON.stringify({ at: Date.now(), data: d })); } catch (e) {}
  }

  // POST text/plain supaya tidak memicu preflight CORS (Apps Script tidak menjawab OPTIONS).
  function rawCall(cfg, action, args) {
    return fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: cfg.token, action: action, args: args || [] })
    }).then(function (r) { return r.text(); }, function () {
      throw new Error('NETWORK');
    }).then(function (txt) {
      var j;
      try { j = JSON.parse(txt); } catch (e) {
        throw new Error('Respons tidak valid. Pastikan URL benar dan deploy Web app memakai akses "Anyone".');
      }
      if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan.');
      return j.data;
    });
  }

  function call(fn) {
    var cfg = getCfg();
    if (!cfg) return Promise.reject(new Error('Aplikasi belum disetel.'));
    return rawCall(cfg, fn, Array.prototype.slice.call(arguments, 1));
  }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  /* ---------------------------------------------------------- data */

  function reload() {
    if (!getCfg()) {
      state.data = null;
      state.busy = false;
      render();
      openSetup(true);
      return Promise.resolve();
    }
    var mine = ++seq;
    state.busy = true;
    state.error = null;
    render();
    return call('load', state.month).then(function (d) {
      if (mine !== seq) return;
      state.data = d;
      state.busy = false;
      state.offlineAt = 0;
      state.loadedAt = Date.now();
      writeCache(state.month, d);
      render();
    }).catch(function (e) {
      if (mine !== seq) return;
      state.busy = false;
      var c = readCache(state.month);
      if (c && e && e.message === 'NETWORK') {
        state.data = c.data;
        state.offlineAt = c.at;
      } else {
        state.error = errMsg(e);
      }
      render();
    });
  }

  /* -------------------------------------------------------- render */

  function render() {
    var showMonth = state.tab === 'sales' || state.tab === 'recap';
    $('top').innerHTML = '<div class="toprow"><h1>Rekap Sales</h1><div class="acts">' +
      (installEvt ? '<button class="btn small" data-act="install">Pasang</button>' : '') +
      '<button class="icon" data-act="settings" aria-label="Pengaturan">⚙️</button></div></div>' + (showMonth
      ? '<div class="monthbar"><button class="icon" data-act="prev" aria-label="Bulan sebelumnya">‹</button>' +
        '<b>' + esc(monthLabel(state.month)) + '</b>' +
        '<button class="icon" data-act="next" aria-label="Bulan berikutnya">›</button></div>'
      : '');

    $('nav').innerHTML = TABS.map(function (t) {
      return '<button data-tab="' + t.id + '"' + (t.id === state.tab ? ' aria-current="page"' : '') +
        '><span>' + t.icon + '</span>' + t.label + '</button>';
    }).join('');

    var v = $('view');
    $('fab').style.display = (state.tab === 'recap' || !state.data) ? 'none' : 'flex';

    if (!getCfg()) {
      v.className = '';
      v.innerHTML = '<div class="empty">Aplikasi belum terhubung ke Google Sheets.<br><br>' +
        '<button class="btn" data-act="settings">Setel sekarang</button></div>';
      $('fab').style.display = 'none';
      return;
    }
    if (state.error) {
      v.className = '';
      v.innerHTML = '<div class="empty">Gagal memuat data.<br><small>' + esc(state.error) +
        '</small><br><br><button class="btn" data-act="retry">Coba lagi</button></div>';
      return;
    }
    if (!state.data) {
      v.className = '';
      v.innerHTML = '<div class="empty">Memuat…</div>';
      return;
    }
    v.className = state.busy ? 'busy' : '';
    var banner = state.offlineAt
      ? '<div class="banner">Tidak terhubung. Menampilkan data terakhir (' +
        esc(new Date(state.offlineAt).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) +
        '). Perubahan butuh koneksi internet.</div>'
      : '';
    v.innerHTML = banner + { sales: viewSales, products: viewProducts, outlets: viewOutlets, recap: viewRecap }[state.tab]();
  }

  function summaryCard(s) {
    return '<div class="card summary"><div class="lbl">Total penjualan</div><div class="big">' + rp(s.total) +
      '</div><div class="lbl">' + s.transactions + ' transaksi · ' + s.qty + ' item terjual</div></div>';
  }

  function viewSales() {
    var d = state.data;
    var h = summaryCard(d.summary);
    if (!d.products.length || !d.outlets.length) {
      h += '<div class="hint">Tambahkan produk dan outlet dulu di tab Produk dan Outlet.</div>';
    }
    if (!d.notas.length) {
      return h + '<div class="empty">Belum ada penjualan di bulan ini.<br>Tekan + untuk menambah.</div>';
    }
    return h + d.notas.map(function (n) {
      return '<div class="card item top" data-act="edit-nota" data-id="' + esc(n.nota) + '">' +
        '<div class="grow"><div class="t">' + esc(n.outlet) + '</div>' +
        '<div class="s">' + esc(fmtDate(n.date)) + ' · ' + n.items.length + ' produk</div>' +
        '<ul class="lines">' + n.items.map(function (l) {
          return '<li><span>' + esc(l.product) + '</span><span>' + l.qty + ' × ' + rp(l.price) + '</span></li>';
        }).join('') + '</ul>' +
        (n.note ? '<div class="s" style="margin-top:4px">' + esc(n.note) + '</div>' : '') + '</div>' +
        '<div class="side"><div class="amt">' + rp(n.total) + '</div>' +
        '<button class="icon" data-act="del-nota" data-id="' + esc(n.nota) + '" aria-label="Hapus">🗑</button></div></div>';
    }).join('');
  }

  function viewProducts() {
    var list = state.data.products;
    if (!list.length) return '<div class="empty">Belum ada produk.<br>Tekan + untuk menambah.</div>';
    return list.map(function (p) {
      return '<div class="card item" data-act="edit-product" data-id="' + esc(p.id) + '">' +
        '<div class="grow"><div class="t">' + esc(p.name) + '</div>' +
        '<div class="s">' + rp(p.price) + ' / ' + esc(p.unit) + '</div></div>' +
        '<button class="icon" data-act="del-product" data-id="' + esc(p.id) + '" aria-label="Hapus">🗑</button></div>';
    }).join('');
  }

  function viewOutlets() {
    var list = state.data.outlets;
    if (!list.length) return '<div class="empty">Belum ada outlet.<br>Tekan + untuk menambah.</div>';
    return list.map(function (o) {
      return '<div class="card item" data-act="edit-outlet" data-id="' + esc(o.id) + '">' +
        '<div class="grow"><div class="t">' + esc(o.name) + '</div>' +
        (o.address ? '<div class="s">' + esc(o.address) + '</div>' : '') + '</div>' +
        '<button class="icon" data-act="del-outlet" data-id="' + esc(o.id) + '" aria-label="Hapus">🗑</button></div>';
    }).join('');
  }

  function bars(rows) {
    if (!rows.length) return '<div class="empty" style="padding:12px">Belum ada data.</div>';
    var max = Math.max.apply(null, rows.map(function (r) { return r.total; })) || 1;
    return rows.map(function (r) {
      return '<div class="bar-row"><div class="top"><span>' + esc(r.label) + '</span><b>' + rp(r.total) +
        '</b></div><div class="bar"><i style="width:' + Math.round(r.total / max * 100) + '%"></i></div>' +
        '<div class="s" style="font-size:13px;color:var(--muted)">' + r.qty + ' item terjual</div></div>';
    }).join('');
  }

  function viewRecap() {
    var d = state.data;
    return summaryCard(d.summary) + '<h3>Per Produk</h3>' + bars(d.byProduct) +
      '<h3>Per Outlet</h3>' + bars(d.byOutlet);
  }

  /* -------------------------------------------------------- modal */

  function closeModal() { $('modal-root').innerHTML = ''; }

  function openModal(title, body, onSave, saveLabel, danger) {
    var root = $('modal-root');
    root.innerHTML = '<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">' +
      '<h2>' + esc(title) + '</h2><form novalidate>' + body +
      '<p class="err" id="err"></p><div class="actions">' +
      '<button type="button" class="btn ghost" id="cancel">Batal</button>' +
      '<button type="submit" class="btn' + (danger ? ' danger' : '') + '" id="save">' + esc(saveLabel || 'Simpan') +
      '</button></div></form></div></div>';
    var form = root.querySelector('form');
    var err = $('err');
    var save = $('save');
    $('cancel').onclick = closeModal;
    form.addEventListener('input', function () { err.textContent = ''; });
    root.querySelector('.overlay').addEventListener('mousedown', function (e) {
      if (e.target === e.currentTarget) closeModal();
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      err.textContent = '';
      var out;
      try { out = onSave(form); } catch (ex) { out = errMsg(ex); }
      if (typeof out === 'string') { err.textContent = out; return; }
      save.disabled = true;
      out.then(function () {
        closeModal();
        toast(danger ? 'Terhapus' : 'Tersimpan');
        reload();
      }).catch(function (ex) {
        save.disabled = false;
        err.textContent = errMsg(ex);
      });
    });
    var first = form.querySelector('input');
    if (first && !first.value) first.focus();
    return form;
  }

  function confirmDelete(text, fn, id) {
    openModal('Hapus data?', '<p>' + esc(text) + '</p>', function () { return call(fn, id); }, 'Hapus', true);
  }

  function fv(f) {
    var o = {};
    Array.prototype.forEach.call(f.elements, function (e) { if (e.name) o[e.name] = e.value; });
    return o;
  }

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function digitsOnly(input) {
    input.addEventListener('input', function () { input.value = input.value.replace(/\D/g, ''); });
  }

  /* ---------------------------------------------------- forms */

  function saleForm(editing) {
    var d = state.data;
    var s = editing || { nota: '', date: today(), outlet: '', note: '', items: [{ product: '', qty: '', price: '' }] };
    var known = {}; // produk di transaksi lama tetap boleh dipertahankan walau sudah dihapus dari master
    if (editing) editing.items.forEach(function (l) { known[l.product] = true; });

    function lineHtml(l) {
      return '<div class="line">' +
        '<div class="lhead"><b class="ln">Produk</b>' +
        '<button type="button" class="icon x" aria-label="Hapus baris">✕</button></div>' +
        '<label>Nama produk<input class="lp" list="dl-p" autocomplete="off" placeholder="Ketik untuk mencari" value="' + esc(l.product) + '"></label>' +
        '<div class="row"><label>Qty<input class="lq" inputmode="numeric" value="' + esc(l.qty) + '"></label>' +
        '<label>Harga satuan<input class="lr" inputmode="numeric" value="' + esc(l.price) + '"></label></div>' +
        '<div class="sub">Subtotal: <b class="ls">0</b></div></div>';
    }

    var body =
      '<datalist id="dl-o">' + d.outlets.map(function (o) { return '<option value="' + esc(o.name) + '">'; }).join('') + '</datalist>' +
      '<datalist id="dl-p">' + d.products.map(function (p) { return '<option value="' + esc(p.name) + '">'; }).join('') + '</datalist>' +
      '<label>Tanggal<input type="date" name="date" value="' + esc(s.date) + '"></label>' +
      '<label>Outlet<input name="outlet" list="dl-o" autocomplete="off" placeholder="Ketik untuk mencari" value="' + esc(s.outlet) + '"></label>' +
      '<div class="sec">Produk</div><div id="lines">' + s.items.map(lineHtml).join('') + '</div>' +
      '<button type="button" class="btn ghost" id="addline" style="padding-left:0">+ Tambah produk</button>' +
      '<label>Catatan (opsional)<input name="note" value="' + esc(s.note) + '"></label>' +
      '<div class="total">Total: <b id="tot">Rp 0</b></div>';

    var form = openModal(editing ? 'Ubah Penjualan' : 'Tambah Penjualan', body, function (f) {
      var v = fv(f);
      var outlet = v.outlet.trim();
      if (!v.date) return 'Pilih tanggal.';
      if (!byName(d.outlets, outlet) && !(editing && outlet === editing.outlet)) return 'Pilih outlet dari daftar.';
      var items = [];
      var els = f.querySelectorAll('.line');
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        var product = el.querySelector('.lp').value.trim();
        var qtyRaw = el.querySelector('.lq').value;
        var priceRaw = el.querySelector('.lr').value;
        if (!product && !qtyRaw && !priceRaw) continue; // baris kosong diabaikan
        var no = 'Produk ' + (i + 1) + ': ';
        var qty = parseInt(qtyRaw, 10);
        var price = parseInt(priceRaw, 10);
        if (!product || (!byName(d.products, product) && !known[product])) return no + 'pilih produk dari daftar.';
        if (!(qty > 0)) return no + 'qty harus lebih dari 0.';
        if (!(price >= 0)) return no + 'isi harga satuan.';
        items.push({ product: product, qty: qty, price: price });
      }
      if (!items.length) return 'Isi minimal satu produk.';
      return call('saveNota', {
        nota: editing ? editing.nota : '', date: v.date, outlet: outlet, note: v.note, items: items
      }).then(function () { state.month = v.date.slice(0, 7); });
    });

    var box = form.querySelector('#lines');
    function refresh() {
      var sum = 0;
      var rows = box.querySelectorAll('.line');
      Array.prototype.forEach.call(rows, function (el, i) {
        el.querySelector('.ln').textContent = 'Produk ' + (i + 1);
        el.querySelector('.x').style.visibility = rows.length > 1 ? 'visible' : 'hidden';
        var sub = (parseInt(el.querySelector('.lq').value, 10) || 0) * (parseInt(el.querySelector('.lr').value, 10) || 0);
        el.querySelector('.ls').textContent = rp(sub);
        sum += sub;
      });
      $('tot').textContent = rp(sum);
    }
    form.addEventListener('input', function (e) {
      var t = e.target;
      if (t.classList.contains('lq') || t.classList.contains('lr')) t.value = t.value.replace(/\D/g, '');
      if (t.classList.contains('lp')) {
        var p = byName(d.products, t.value.trim());
        if (p) t.closest('.line').querySelector('.lr').value = String(p.price);
      }
      refresh();
    });
    form.addEventListener('click', function (e) {
      var x = e.target.closest('.x');
      if (x) {
        x.closest('.line').remove();
        refresh();
      } else if (e.target.id === 'addline') {
        box.insertAdjacentHTML('beforeend', lineHtml({ product: '', qty: '', price: '' }));
        refresh();
        var last = box.lastElementChild;
        last.scrollIntoView({ block: 'nearest' });
        last.querySelector('.lp').focus();
      }
    });
    // Enter di kolom isian tidak boleh langsung menyimpan: transaksi bisa masih setengah terisi.
    form.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.preventDefault();
    });
    refresh();
  }

  function byNota(list, nota) {
    for (var i = 0; i < list.length; i++) if (list[i].nota === nota) return list[i];
    return null;
  }

  function byName(list, name) {
    for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i];
    return null;
  }

  function productForm(editing) {
    var p = editing || { name: '', price: '', unit: 'pcs' };
    var form = openModal(editing ? 'Ubah Produk' : 'Tambah Produk',
      '<label>Nama produk<input name="name" value="' + esc(p.name) + '"></label>' +
      '<label>Harga satuan<input name="price" inputmode="numeric" value="' + esc(p.price) + '"></label>' +
      '<label>Satuan (pcs, box, strip, ...)<input name="unit" value="' + esc(p.unit) + '"></label>',
      function (f) {
        var v = fv(f);
        if (!v.name.trim()) return 'Nama produk wajib diisi.';
        return call('saveProduct', {
          id: editing ? editing.id : '', name: v.name, price: parseInt(v.price, 10) || 0, unit: v.unit
        });
      });
    digitsOnly(form.elements.price);
  }

  function outletForm(editing) {
    var o = editing || { name: '', address: '' };
    openModal(editing ? 'Ubah Outlet' : 'Tambah Outlet',
      '<label>Nama outlet<input name="name" value="' + esc(o.name) + '"></label>' +
      '<label>Alamat (opsional)<input name="address" value="' + esc(o.address) + '"></label>',
      function (f) {
        var v = fv(f);
        if (!v.name.trim()) return 'Nama outlet wajib diisi.';
        return call('saveOutlet', { id: editing ? editing.id : '', name: v.name, address: v.address });
      });
  }

  function openSetup(first) {
    var cfg = getCfg() || { url: '', token: '' };
    var connected = !!getCfg();
    var form = openModal(first ? 'Hubungkan ke Google Sheets' : 'Pengaturan',
      '<p class="help">Isi URL Web app Apps Script (berakhiran <b>/exec</b>) dan kode akses dari menu ' +
      '<b>Rekap Sales &gt; Buat kode akses baru</b> di Google Sheet Anda.</p>' +
      '<label>URL Web app<input name="url" inputmode="url" autocomplete="off" autocapitalize="off" value="' + esc(cfg.url) + '"></label>' +
      '<label>Kode akses<input name="token" type="password" autocomplete="off" value="' + esc(cfg.token) + '"></label>' +
      (connected ? '<button type="button" class="btn ghost" id="logout" style="color:var(--danger);padding-left:0">Putuskan sambungan</button>' : ''),
      function (f) {
        var v = fv(f);
        var url = v.url.trim();
        var token = v.token.trim();
        if (!/^https:\/\/script\.google\.com\/.+\/exec(\?.*)?$/.test(url)) {
          return 'URL harus alamat Web app Apps Script, berakhiran /exec.';
        }
        if (!token) return 'Kode akses wajib diisi.';
        var c = { url: url, token: token };
        return rawCall(c, 'load', [state.month]).then(function () {
          if (!getCfg() || getCfg().url !== url) clearCache();
          setCfg(c);
          state.data = null;
        });
      }, 'Simpan');
    var out = form.querySelector('#logout');
    if (out) out.onclick = function () {
      setCfg(null);
      clearCache();
      state.data = null;
      state.offlineAt = 0;
      closeModal();
      render();
    };
  }

  /* ------------------------------------------------------ events */

  document.addEventListener('click', function (e) {
    var tab = e.target.closest('[data-tab]');
    if (tab) { state.tab = tab.getAttribute('data-tab'); render(); window.scrollTo(0, 0); return; }

    var el = e.target.closest('[data-act]');
    var act = el && el.getAttribute('data-act');
    if (!el || (!state.data && act !== 'retry' && act !== 'settings' && act !== 'install')) return;
    var id = el.getAttribute('data-id');
    var d = state.data;

    if (act === 'prev') { state.month = shiftMonth(state.month, -1); reload(); }
    else if (act === 'next') { state.month = shiftMonth(state.month, 1); reload(); }
    else if (act === 'retry') reload();
    else if (act === 'settings') openSetup(false);
    else if (act === 'install') {
      if (installEvt) {
        var ev = installEvt;
        ev.prompt();
        ev.userChoice.then(function () { installEvt = null; render(); }, function () {});
      }
    }
    else if (act === 'edit-nota') saleForm(byNota(d.notas, id));
    else if (act === 'edit-product') productForm(byId(d.products, id));
    else if (act === 'edit-outlet') outletForm(byId(d.outlets, id));
    else if (act === 'del-nota') {
      var n = byNota(d.notas, id);
      if (n) confirmDelete('Penjualan ' + n.outlet + ' (' + n.items.length + ' produk, ' + rp(n.total) + ') akan dihapus.', 'deleteNota', id);
    } else if (act === 'del-product') {
      var p = byId(d.products, id);
      if (p) confirmDelete('Produk "' + p.name + '" akan dihapus. Riwayat penjualan tidak ikut terhapus.', 'deleteProduct', id);
    } else if (act === 'del-outlet') {
      var o = byId(d.outlets, id);
      if (o) confirmDelete('Outlet "' + o.name + '" akan dihapus. Riwayat penjualan tidak ikut terhapus.', 'deleteOutlet', id);
    }
  });

  $('fab').addEventListener('click', function () {
    if (!state.data) return;
    if (state.tab === 'sales') saleForm(null);
    else if (state.tab === 'products') productForm(null);
    else if (state.tab === 'outlets') outletForm(null);
  });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installEvt = e;
    render();
  });
  window.addEventListener('appinstalled', function () {
    installEvt = null;
    render();
    toast('Aplikasi terpasang');
  });
  window.addEventListener('online', function () { if (getCfg()) reload(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && getCfg() && !state.busy &&
        Date.now() - state.loadedAt > 60000 && !document.querySelector('.overlay')) {
      reload();
    }
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  var openAdd = /[?&]add=sale/.test(location.search);
  render();
  reload().then(function () {
    if (openAdd && state.data && !document.querySelector('.overlay')) saleForm(null);
  });
})();
</script>
</body>
</html>
