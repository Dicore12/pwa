<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rekap Sales">
<title>Rekap Sales</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1b2330; --muted: #667085; --primary: #1a73e8;
    --on-primary: #ffffff; --border: #e1e6ef; --soft: #eef2fa; --danger: #d93025;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #10141b; --card: #1a202b; --text: #e8ecf3; --muted: #98a2b3; --primary: #6ea8fe;
      --on-primary: #0b1220; --border: #2a3342; --soft: #232b38; --danger: #ff7b72; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { max-width: 640px; margin: 0 auto; padding: 12px 16px calc(150px + env(safe-area-inset-bottom)); }
  h1 { margin: 0 0 4px; font-size: 22px; }

  .toprow { display: flex; align-items: center; justify-content: space-between; }
  .toprow h1 { margin: 0 0 4px; }
  .toprow .acts { display: flex; align-items: center; gap: 4px; }
  .mnav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 2px; }
  .mnav b { font-size: 16px; }
  .sync { text-align: center; font-size: 12px; color: var(--muted); margin: 0 0 10px; min-height: 1.2em; }

  .btn { background: var(--primary); color: var(--on-primary); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; }
  .btn.ghost { background: none; color: var(--primary); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn[disabled] { opacity: .6; }
  .icon { background: none; border: 0; font-size: 18px; padding: 6px 8px; border-radius: 8px; line-height: 1; }
  .icon:active { background: var(--soft); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .card.item { display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .card.item:active { background: var(--soft); }
  .grow { flex: 1; min-width: 0; }
  .t { font-weight: 600; overflow-wrap: anywhere; }
  .s { color: var(--muted); font-size: 13px; }
  .amt { font-weight: 700; white-space: nowrap; }
  .summary .big { font-size: 26px; font-weight: 700; margin: 2px 0; }
  .lbl { color: var(--muted); font-size: 13px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 12px; }
  .hint { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
  #view.busy { opacity: .5; transition: opacity .15s; }

  h3 { margin: 18px 0 8px; font-size: 16px; }
  .sechead { display: flex; align-items: center; justify-content: space-between; width: 100%; margin: 18px 0 8px;
    padding: 10px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    font-size: 16px; font-weight: 700; text-align: left; }
  .sechead small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .sechead:active { background: var(--soft); }
  .dl .row { margin: 10px 0 0; }
  .dl .btn { flex: 1; }
  .dl-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-right: auto; }
  .bar-row { margin-bottom: 12px; }
  .bar-row .top { display: flex; justify-content: space-between; gap: 8px; }
  .bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; margin: 4px 0; }
  .bar i { display: block; height: 100%; background: var(--primary); border-radius: 4px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card);
    border-top: 1px solid var(--border); display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom); }
  nav .in { display: flex; width: 100%; max-width: 640px; }
  nav button { flex: 1; background: none; border: 0; padding: 8px 0 10px; font-size: 12px; color: var(--muted); }
  nav button span { display: block; font-size: 20px; }
  nav button[aria-current="page"] { color: var(--primary); font-weight: 700; }

  .fab { position: fixed; z-index: 6; right: max(16px, calc((100vw - 640px) / 2 + 16px));
    bottom: calc(80px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 16px;
    border: 0; background: var(--primary); color: var(--on-primary); font-size: 30px; line-height: 1;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .3); display: none; align-items: center; justify-content: center; }

  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .45);
    display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 18px; } }
  .sheet h2 { margin: -18px -18px 12px; padding: 18px 18px 10px; font-size: 18px; overflow-wrap: anywhere;
    position: sticky; top: -18px; z-index: 3; /* -18px = padding .sheet */ background: var(--card); border-bottom: 1px solid var(--border); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  input { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  .row { display: flex; gap: 10px; } .row label { flex: 1; min-width: 0; }
  .err { color: var(--danger); min-height: 1.2em; margin: 4px 0; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #323232; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 30;
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; }
  #toast.show { opacity: .95; }

  .banner { background: #fff4e5; color: #7a4b00; border-radius: 10px; padding: 8px 12px;
    margin-bottom: 12px; font-size: 13px; }
  .banner[hidden] { display: none; }
  .banner.bad { background: #fdecea; color: #8a1c14; }
  @media (prefers-color-scheme: dark) { .banner { background: #3a2c10; color: #ffd591; } .banner.bad { background: #3d1a17; color: #ffb4ab; } }
  .help { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

  .item.top { align-items: flex-start; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .lines { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; }
  .lines li { display: flex; justify-content: space-between; gap: 8px; }
  .lines li span:first-child { overflow-wrap: anywhere; }
  .lines li span:last-child { color: var(--muted); white-space: nowrap; }
  .sec { font-weight: 600; margin: 4px 0 8px; }
  .line { border: 1px solid var(--border); border-radius: 12px; padding: 2px 12px 10px; margin-bottom: 10px; }
  .line label { margin-bottom: 8px; }
  .lhead { display: flex; align-items: center; justify-content: space-between; }
  .line .sub { text-align: right; font-size: 13px; color: var(--muted); }
  .adj { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .alls { background: var(--soft); border-radius: 12px; padding: 10px 12px 2px; margin: 4px 0 12px; }
  .alls .row { margin-bottom: 0; }
  .alls .hint-sm { margin: 0 0 8px; }
  .tbox { border-top: 1px solid var(--border); margin: 8px 0; padding-top: 8px; }
  .trow { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); padding: 2px 0; }
  .trow[hidden] { display: none; }
  .trow.grand { font-size: 17px; color: var(--text); padding-top: 6px; }
  .tg { display: block; font-size: 11px; color: var(--muted); }
  .brk { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .bar-row.tap { cursor: pointer; padding: 6px 8px; margin: 0 -8px 6px; border-radius: 10px; }
  .bar-row.tap:active, .bar-row.tap:focus-visible { background: var(--soft); outline: none; }
  .chev { color: var(--muted); margin-left: 2px; }
  .hint-sm { font-size: 13px; color: var(--muted); margin: -4px 0 8px; }
  .sheet h3:first-of-type { margin-top: 8px; }

  .cbw { position: relative; margin-bottom: 10px; }
  .cbw > label { margin-bottom: 0; }
  .line .cbw > label { margin-bottom: 0; }
  .cbin { padding-right: 34px; background-repeat: no-repeat; background-position: right 12px center;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23788398' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>"); }
  .dd { position: absolute; left: 0; right: 0; top: 100%; margin-top: 2px; z-index: 40; max-height: 220px;
    overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .28); }
  .dd[hidden] { display: none; }
  .opt { display: flex; justify-content: space-between; gap: 10px; padding: 12px; font-size: 15px;
    border-bottom: 1px solid var(--border); cursor: pointer; color: var(--text); }
  .opt:last-child { border-bottom: 0; }
  .opt small { color: var(--muted); white-space: nowrap; align-self: center; }
  .opt span { overflow-wrap: anywhere; }
  .opt.sel { background: var(--soft); font-weight: 600; }
  .opt.act, .opt:active { background: var(--soft); }
  .opt.none { color: var(--muted); cursor: default; font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <header id="top"></header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Tambah">+</button>
<nav><div class="in" id="nav"></div></nav>
<div id="modal-root"></div>
<div id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  var MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus',
                'September', 'Oktober', 'November', 'Desember'];
  var TABS = [
    { id: 'sales', label: 'Penjualan', icon: '🧾' },
    { id: 'products', label: 'Produk', icon: '📦' },
    { id: 'outlets', label: 'Outlet', icon: '🏪' },
    { id: 'recap', label: 'Rekap', icon: '📊' }
  ];
  // Sinkronisasi otomatis: cek perubahan dari perangkat lain tiap beberapa detik selama aplikasi terlihat.
  // Versi API Code.gs yang dibutuhkan aplikasi ini (lihat API_VERSION di Code.gs).
  var API_NEED = 3;
  var SYNC_MS = Number(window.RS_SYNC_MS) || 20000;

  var state = { tab: 'sales', month: ym(new Date()), data: null, sig: '', error: null, busy: false,
                offlineAt: 0, loadedAt: 0, pending: null, onPending: null, openProducts: false };
  var installEvt = null;
  var seq = 0;          // setiap pemuatan baru membuat balasan pemuatan lama diabaikan
  var inflight = 0;
  var lastErr = '';
  var addShortcutDone = false;

  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ym(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function today() { var d = new Date(); return ym(d) + '-' + pad(d.getDate()); }
  function shiftMonth(m, delta) {
    var p = m.split('-');
    return ym(new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1));
  }
  function monthLabel(m) { var p = m.split('-'); return MONTHS[Number(p[1]) - 1] + ' ' + p[0]; }
  function fmtDate(s) { var p = s.split('-'); return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1].slice(0, 3) + ' ' + p[0]; }
  function rp(n) { return 'Rp ' + Number(n || 0).toLocaleString('id-ID'); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clock(ms) {
    return new Date(ms).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }

  // Hitungan harus sama persis dengan calc_ di Code.gs: diskon dari subtotal, pajak dari subtotal setelah diskon.
  // Persen dikali 100 dulu supaya hitungan bulat; tiap nominal dibulatkan ke rupiah (setengah naik).
  function calc(qty, price, disc, tax) {
    var sub = qty * price;
    var discAmt = Math.round(sub * Math.round(disc * 100) / 10000);
    var net = sub - discAmt;
    var taxAmt = Math.round(net * Math.round(tax * 100) / 10000);
    return { sub: sub, discAmt: discAmt, taxAmt: taxAmt, total: net + taxAmt };
  }
  function fmtPct(n) { return String(n).replace('.', ','); }
  /** Isian persen: kosong = 0, boleh koma atau titik, 0-100, maksimal 2 desimal. Tidak valid = NaN. */
  function pctNum(v) {
    var s = String(v == null ? '' : v).trim().replace(',', '.');
    if (s === '') return 0;
    if (!/^(\d+\.?\d{0,2}|\.\d{1,2})$/.test(s)) return NaN;
    var n = Number(s);
    return n > 100 ? NaN : n;
  }
  function cleanPct(v) {
    var s = String(v).replace(/[^\d.,]/g, '');
    var i = s.search(/[.,]/);
    if (i < 0) return s;
    return s.slice(0, i + 1) + s.slice(i + 1).replace(/[.,]/g, '').slice(0, 2);
  }
  /** Nilai awal isian persen: angka > 0 jadi teks, selain itu kosong. */
  function pv(x) { return typeof x === 'number' ? (x > 0 ? fmtPct(x) : '') : (x || ''); }
  /** Rincian satu nota dihitung dari barisnya (juga untuk data lama di cache yang belum punya disc/pajak). */
  function nb(n) {
    var b = { sub: 0, disc: 0, tax: 0 };
    n.items.forEach(function (l) {
      var c = calc(l.qty, l.price, l.disc || 0, l.tax || 0);
      b.sub += c.sub; b.disc += c.discAmt; b.tax += c.taxAmt;
    });
    return b;
  }
  function lineTag(l) {
    var t = [];
    if (l.disc > 0) t.push('Disc ' + fmtPct(l.disc) + '%');
    if (l.tax > 0) t.push('Pajak ' + fmtPct(l.tax) + '%');
    return t.length ? '<small class="tg">' + t.join(' · ') + '</small>' : '';
  }
  function brk(n) {
    var b = nb(n);
    if (!b.disc && !b.tax) return '';
    return '<div class="brk">Subtotal ' + rp(b.sub) + (b.disc ? ' · Diskon −' + rp(b.disc) : '') +
      (b.tax ? ' · Pajak +' + rp(b.tax) : '') + '</div>';
  }

  var toastT = 0;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }

  /* ------------------------------------------------------------ penyimpanan lokal */
  var CFG_KEY = 'rs-config';
  var CACHE_PREFIX = 'rs-cache-';
  function getCfg() {
    try {
      var c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
      return c && c.url && c.token ? c : null;
    } catch (e) { return null; }
  }
  /** Nama sales di HP ini: penjualan hanya tampil di HP dengan nama yang sama. Kosong = data tanpa nama. */
  function owner() { var c = getCfg(); return c && c.owner ? String(c.owner).trim() : ''; }
  function setCfg(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) { /* abaikan */ } }
  function clearCfg() { try { localStorage.removeItem(CFG_KEY); } catch (e) { /* abaikan */ } }
  function saveCache(month, data) {
    try { localStorage.setItem(CACHE_PREFIX + month, JSON.stringify({ at: Date.now(), data: data })); } catch (e) { /* abaikan */ }
  }
  function validData(d) {
    return !!d && Array.isArray(d.notas) && Array.isArray(d.products) && Array.isArray(d.outlets) &&
      d.notas.every(function (n) { return n && Array.isArray(n.items); });
  }
  function readCache(month) {
    try {
      var c = JSON.parse(localStorage.getItem(CACHE_PREFIX + month) || 'null');
      return c && validData(c.data) ? c : null;
    } catch (e) { return null; }
  }
  function clearCache() {
    try {
      Object.keys(localStorage).forEach(function (k) {
        if (k.indexOf(CACHE_PREFIX) === 0) localStorage.removeItem(k);
      });
    } catch (e) { /* abaikan */ }
  }

  /* ------------------------------------------------------------ panggilan API */
  function rawCall(cfg, action, args) {
    return fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // text/plain: tanpa preflight CORS
      body: JSON.stringify({ token: cfg.token, action: action, args: args || [] }),
      redirect: 'follow'
    }).then(function (res) {
      return res.text();
    }, function () {
      var e = new Error('Tidak bisa terhubung ke server. Periksa internet dan alamat Web app.');
      e.network = true;
      throw e;
    }).then(function (text) {
      var j;
      try { j = JSON.parse(text); } catch (e) {
        throw new Error('Respons tidak valid dari server. Pastikan URL benar dan kode terbaru sudah di-deploy sebagai New version.');
      }
      if (!j || j.ok !== true) throw new Error((j && j.error) || 'Terjadi kesalahan.');
      return j.data;
    });
  }
  var OUTDATED_MSG = 'Code.gs di Google Sheet masih versi lama, jadi data bisa tercampur antar-HP. Perbarui dulu: tempel Code.gs terbaru lalu Deploy > Manage deployments > pensil > New version.';
  function outdated() { return !!state.data && state.data.api !== API_NEED; }
  function call(action) {
    var cfg = getCfg();
    if (!cfg) return Promise.reject(new Error('Belum terhubung ke Google Sheets.'));
    if (outdated()) return Promise.reject(new Error(OUTDATED_MSG));
    return rawCall(cfg, action, Array.prototype.slice.call(arguments, 1));
  }

  /* ------------------------------------------------------------ pemuatan data + sinkronisasi */
  /**
   * opts.silent: pemuatan latar belakang (sinkronisasi), tidak mengganggu layar.
   * opts.manual: dari tombol segarkan, selalu beri tahu hasilnya.
   */
  function reload(opts) {
    opts = opts || {};
    var cfg = getCfg();
    if (!cfg) { state.data = null; render(); return Promise.resolve(); }
    var my = ++seq;
    inflight++;
    if (!opts.silent) { state.busy = true; state.error = null; render(); }
    return rawCall(cfg, 'load', [state.month, cfg.owner || '']).then(function (data) {
      if (my !== seq) return;
      var wasOffline = !!state.offlineAt;
      state.busy = false;
      state.error = null;
      state.offlineAt = 0;
      lastErr = '';
      saveCache(state.month, data);
      applyData(data, opts, wasOffline);
    }).catch(function (err) {
      if (my !== seq) return;
      state.busy = false;
      if (err.network) {
        var cached = state.data ? null : readCache(state.month);
        if (cached) { state.data = cached.data; state.sig = JSON.stringify(cached.data); state.offlineAt = cached.at; state.error = null; }
        else if (state.data) { state.offlineAt = state.offlineAt || Date.now(); }
        else { state.error = err.message; }
      } else if (!state.data) {
        state.error = err.message;
      } else if (opts.silent && err.message !== lastErr) {
        toast(err.message);
      }
      lastErr = err.message;
      if (!opts.silent || !modalOpen()) render();
      else if (opts.manual) toast(err.message);
    }).then(function () {
      inflight--;
    });
  }

  function applyData(data, opts, wasOffline) {
    var sig = JSON.stringify(data);
    var changed = sig !== state.sig;
    if (opts.silent && modalOpen()) {
      // Ada form terbuka: jangan ubah layar di bawahnya. Terapkan setelah ditutup.
      if (changed || state.pending) {
        state.pending = data;
        if (state.onPending) state.onPending(data);
      }
      return;
    }
    state.pending = null;
    state.data = data;
    state.sig = sig;
    state.loadedAt = Date.now();
    if (!changed && opts.silent && !opts.manual && !wasOffline && state.shown) {
      renderTop();                  // tidak ada yang berubah: layar tidak digambar ulang, hanya jam "diperbarui"
      return;
    }
    render();
    if (opts.silent && changed && state.shown) toast('Data diperbarui dari perangkat lain');
    if (opts.manual) toast(changed ? 'Data diperbarui' : 'Sudah yang terbaru');
    state.shown = true;
    runShortcut();
  }

  function syncNow(onEvent) {
    if (!getCfg() || !state.data || inflight) return;
    if (document.visibilityState !== 'visible') return;
    // Kembali ke aplikasi / sinyal pulih: cek segera, kecuali baru saja memuat.
    if (onEvent && Date.now() - state.loadedAt < 2500 && !state.offlineAt) return;
    reload({ silent: true });
  }
  function startSync() {
    setInterval(function () { syncNow(false); }, SYNC_MS);
    function onEvent() { syncNow(true); }
    document.addEventListener('visibilitychange', onEvent);
    window.addEventListener('focus', onEvent);
    window.addEventListener('online', onEvent);
  }

  /* ------------------------------------------------------------ tampilan */
  function renderTop() {
    var showMonth = state.tab === 'sales' || state.tab === 'recap';
    $('top').innerHTML =
      '<div class="toprow"><h1>Rekap Sales</h1><div class="acts">' +
      (installEvt ? '<button class="btn small" data-act="install">Pasang</button>' : '') +

      (showMonth
        ? '<div class="mnav"><button class="icon" data-act="prev" aria-label="Bulan sebelumnya">‹</button><b>' +

        : '') +
      '<div class="sync">' + (getCfg() ? 'Sales: ' + esc(owner() || '(tanpa nama)') : '') +
      (state.data && state.loadedAt && !state.offlineAt ? ' · diperbarui ' + clock(state.loadedAt) : '') + '</div>';

  function renderNav() {

      'Tempel <b>Code.gs</b> terbaru di Apps Script, lalu <b>Deploy &gt; Manage deployments &gt; pensil &gt; Version: New version</b>.</div>' : '';
    var banner = warn + (state.offlineAt ? '' : '') + (state.offlineAt

        '). Perubahan butuh koneksi internet.</div>'

  function summaryCard(s) {
    var parts = [];
    if (s.discount) parts.push('Diskon −' + rp(s.discount));
    if (s.tax) parts.push('Pajak +' + rp(s.tax));
    var detail = parts.length ? '<div class="lbl">Subtotal ' + rp(s.subtotal) + ' · ' + parts.join(' · ') + '</div>' : '';
    return '<div class="card summary"><div class="lbl">Total penjualan</div><div class="big">' + rp(s.total) + '</div>' + detail +
      '<div class="lbl">' + s.transactions + ' transaksi · ' + s.qty + ' item terjual</div></div>';
  }

    var d = state.data;
    var h = summaryCard(d.summary);
    if (!d.products.length || !d.outlets.length) {
      h += '<div class="hint">Tambahkan produk dan outlet dulu di tab Produk dan Outlet.</div>';

        '<ul class="lines">' + n.items.map(function (l) {
          return '<li><span>' + esc(l.product) + lineTag(l) + '</span><span>' + l.qty + ' × ' + rp(l.price) + '</span></li>';

  function viewProducts() {

        '<button class="icon" data-act="del-product" data-id="' + esc(p.id) + '" aria-label="Hapus">🗑</button></div>';

  function viewOutlets() {
    var list = state.data.outlets;

        '<div class="grow"><div class="t">' + esc(o.name) + '</div>' +

        '<button class="icon" data-act="del-outlet" data-id="' + esc(o.id) + '" aria-label="Hapus">🗑</button></div>';

  function bars(rows, tapAct) {
    if (!rows.length) return '<div class="empty" style="padding:12px">Belum ada data.</div>';
    var max = Math.max.apply(null, rows.map(function (r) { return r.total; })) || 1;
    return rows.map(function (r) {
      var pct = Math.max(2, Math.round(r.total / max * 100));
      return '<div class="bar-row' + (tapAct ? ' tap' : '') + '"' +
        (tapAct ? ' data-act="' + tapAct + '" data-name="' + esc(r.label) + '" role="button" tabindex="0"' : '') + '>' +
        '<div class="top"><span>' + esc(r.label) + (tapAct ? '<span class="chev"> ›</span>' : '') + '</span><b>' + rp(r.total) + '</b></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="s">' + r.qty + ' item</div></div>';
    }).join('');
  }

  function viewRecap() {

      ? '<div class="card dl"><div class="t">Unduh rekap per outlet</div>' +

      '<span class="chev">' + (state.openProducts ? '▾' : '▸') + '</span></button>' +
      (state.openProducts ? bars(d.byProduct) : '') +

  /* ------------------------------------------------------------ lembar (modal) */
  function modalOpen() { return !!$('modal-root').firstChild; }

  function closeModal() {
    $('modal-root').innerHTML = '';
    state.onPending = null;
    if (state.pending) {            // perubahan dari perangkat lain yang tertahan selama form terbuka
      var d = state.pending;
      state.pending = null;
      applyData(d, { silent: true });
    }
  }

  function fv(f) {
    var v = {};
    Array.prototype.forEach.call(f.elements, function (el) { if (el.name) v[el.name] = el.value; });
    return v;
  }
  function digitsOnly(input) {
    input.addEventListener('input', function () { input.value = input.value.replace(/\D/g, ''); });
  }

  /** onSave(form) mengembalikan teks error, atau Promise (sukses = tutup + muat ulang). */
  function openModal(title, body, onSave, saveLabel) {
    var root = $('modal-root');
    root.innerHTML = '<div class="overlay"><form class="sheet" role="dialog" aria-modal="true" novalidate>' +
      '<h2>' + esc(title) + '</h2>' + body + '<div class="err" id="err" role="alert"></div>' +
      '<div class="actions"><button type="button" class="btn ghost" id="cancel">Batal</button>' +
      '<button type="button" class="btn' + (saveLabel === 'Hapus' ? ' danger' : '') + '" id="save">' + esc(saveLabel || 'Simpan') + '</button></div>' +
      '</form></div>';
    var form = root.querySelector('form');
    var err = $('err');
    form.addEventListener('submit', function (e) { e.preventDefault(); });
    form.addEventListener('input', function () { err.textContent = ''; });
    $('cancel').onclick = closeModal;
    root.querySelector('.overlay').addEventListener('mousedown', function (e) {
      if (e.target === e.currentTarget) closeModal();
    });
    $('save').onclick = function () {
      var btn = $('save');
      var r;
      try { r = onSave(form); } catch (e) { err.textContent = e.message; return; }
      if (typeof r === 'string') { err.textContent = r; return; }
      btn.disabled = true;
      Promise.resolve(r).then(function () {
        state.pending = null;
        closeModal();
        toast('Tersimpan');
        return reload();
      }, function (e) {
        btn.disabled = false;
        err.textContent = e.message;
      });
    };
    return form;
  }

  function openInfo(title, body, extra) {
    var root = $('modal-root');
    root.innerHTML = '<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">' +
      '<h2>' + esc(title) + '</h2>' + body +
      '<div class="actions">' + (extra || '') + '<button type="button" class="btn" id="cancel">Tutup</button></div></div></div>';
    $('cancel').onclick = closeModal;
    root.querySelector('.overlay').addEventListener('mousedown', function (e) {
      if (e.target === e.currentTarget) closeModal();
    });
    $('cancel').focus({ preventScroll: true }); // jangan menggulung ke tombol di dasar daftar panjang
  }

  function confirmDelete(title, message, fn) {
    openModal(title, '<p>' + message + '</p>', function () { return fn(); }, 'Hapus');
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !e.defaultPrevented && modalOpen()) closeModal();
  });

  /* ------------------------------------------------------------ dropdown yang bisa dicari */
  function combo(input, getOptions, opts) {
    opts = opts || {};
    var dd = input.closest('.cbw').querySelector('.dd');
    var items = [];
    var act = -1;

    function paint() {
      if (!items.length) {
        dd.innerHTML = '<div class="opt none">' + esc(opts.empty || 'Tidak ada pilihan.') + '</div>';
        return;
      }
      dd.innerHTML = items.map(function (o, i) {
        return '<div class="opt' + (o.value === input.value ? ' sel' : '') + (i === act ? ' act' : '') + '" data-i="' + i + '">' +
          '<span>' + esc(o.value) + '</span>' + (o.sub ? '<small>' + esc(o.sub) + '</small>' : '') + '</div>';
      }).join('');
    }
    function open(showAll) {
      var q = showAll ? '' : input.value.trim().toLowerCase();
      var all = getOptions();
      items = q ? all.filter(function (o) { return o.value.toLowerCase().indexOf(q) >= 0; }) : all;
      act = showAll ? -1 : (items.length ? 0 : -1);
      paint();
      dd.hidden = false;
      var sel = dd.querySelector('.sel');
      if (sel) dd.scrollTop = sel.offsetTop - 40;
    }
    function close() { dd.hidden = true; act = -1; }
    function pick(o) {
      input.value = o.value;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      close();
      if (opts.next) opts.next();
    }
    function move(delta) {
      if (!items.length) return;
      act = (act + delta + items.length) % items.length;
      paint();
      var el = dd.querySelector('.act');
      if (el) el.scrollIntoView({ block: 'nearest' });
    }

    input.addEventListener('focus', function () { open(true); });
    input.addEventListener('click', function () { if (dd.hidden) open(true); });
    input.addEventListener('input', function () { open(false); });
    input.addEventListener('blur', function () {
      setTimeout(function () { if (document.activeElement !== input) close(); }, 150);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); if (dd.hidden) open(false); else move(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (!dd.hidden) move(-1); }
      else if (e.key === 'Enter') { if (!dd.hidden && act >= 0) { e.preventDefault(); pick(items[act]); } }
      else if (e.key === 'Escape') { if (!dd.hidden) { e.preventDefault(); close(); } }
      else if (e.key === 'Tab') close();
    });
    dd.addEventListener('mousedown', function (e) { e.preventDefault(); }); // jaga fokus di kolom isian
    dd.addEventListener('click', function (e) {
      var el = e.target.closest('.opt');
      if (el && el.getAttribute('data-i') !== null) pick(items[Number(el.getAttribute('data-i'))]);
    });
  }

  /* ------------------------------------------------------------ form */
  function byNota(list, nota) {
    for (var i = 0; i < list.length; i++) if (list[i].nota === nota) return list[i];
    return null;
  }
  function byName(list, name) {
    for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i];
    return null;
  }

  function saleForm(editing) {
    var d = state.data;
    var s = editing || { nota: '', date: today(), outlet: '', note: '', items: [{ product: '', qty: '', price: '' }] };
    var known = {}; // produk di transaksi lama tetap boleh dipertahankan walau sudah dihapus dari master
    if (editing) editing.items.forEach(function (l) { known[l.product] = true; });
    var baseline = editing ? JSON.stringify(editing) : '';

    function lineHtml(l) {
      return '<div class="line">' +
        '<div class="lhead"><b class="ln">Produk</b>' +
        '<button type="button" class="icon x" aria-label="Hapus baris">✕</button></div>' +
        '<div class="cbw"><label>Nama produk<input class="lp cbin" autocomplete="off" placeholder="Ketuk untuk memilih produk" value="' + esc(l.product) + '"></label><div class="dd" hidden></div></div>' +
        '<div class="row"><label>Qty<input class="lq" inputmode="numeric" value="' + esc(l.qty) + '"></label>' +
        '<label>Harga satuan<input class="lr" inputmode="numeric" value="' + esc(l.price) + '"></label></div>' +
        '<div class="row"><label>Disc %<input class="ld" inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(pv(l.disc)) + '"></label>' +
        '<label>Pajak %<input class="lt" inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(pv(l.tax)) + '"></label></div>' +
        '<div class="sub"><div class="adj" hidden></div>Total: <b class="ls">0</b></div></div>';
    }

    var body =
      (editing ? '<div class="banner" id="syncnote" hidden></div>' : '') +
      '<label>Tanggal<input type="date" name="date" value="' + esc(s.date) + '"></label>' +
      '<div class="cbw"><label>Outlet<input name="outlet" class="cbin" autocomplete="off" placeholder="Ketuk untuk memilih outlet" value="' + esc(s.outlet) + '"></label><div class="dd" hidden></div></div>' +
      '<div class="sec">Produk</div><div id="lines">' + s.items.map(lineHtml).join('') + '</div>' +
      '<button type="button" class="btn ghost" id="addline" style="padding-left:0">+ Tambah produk</button>' +
      '<div class="alls"><div class="hint-sm">Diskon dan pajak untuk semua produk sekaligus. Tiap produk tetap bisa diubah sendiri.</div>' +
      '<div class="row"><label>Disc % semua<input id="alld" inputmode="decimal" autocomplete="off" placeholder="0"></label>' +
      '<label>Pajak % semua<input id="allt" inputmode="decimal" autocomplete="off" placeholder="0"></label></div></div>' +
      '<label>Catatan (opsional)<input name="note" value="' + esc(s.note) + '"></label>' +
      '<div class="tbox">' +
      '<div class="trow"><span>Subtotal</span><b id="tsub">Rp 0</b></div>' +
      '<div class="trow" id="tdr" hidden><span>Diskon</span><b id="tdisc"></b></div>' +
      '<div class="trow" id="ttr" hidden><span>Pajak</span><b id="ttax"></b></div>' +
      '<div class="trow grand"><span>Total</span><b id="tot">Rp 0</b></div></div>';

    // Mengubah penjualan yang sudah diubah/dihapus di perangkat lain tidak boleh menimpa diam-diam.
    function staleMessage(data) {
      if (!editing || !data) return '';
      var latest = byNota(data.notas, editing.nota);
      if (!latest) return 'Penjualan ini sudah dihapus di perangkat lain. Tutup form ini lalu muat ulang.';
      if (JSON.stringify(latest) !== baseline) {
        return 'Penjualan ini baru diubah di perangkat lain. Tutup form ini lalu buka lagi supaya perubahan itu tidak tertimpa.';
      }
      return '';
    }

    var form = openModal(editing ? 'Ubah Penjualan' : 'Tambah Penjualan', body, function (f) {
      var v = fv(f);
      var outlet = v.outlet.trim();
      var stale = staleMessage(state.pending);
      if (stale) return stale;
      if (!v.date) return 'Pilih tanggal.';
      if (!byName(d.outlets, outlet) && !(editing && outlet === editing.outlet)) return 'Pilih outlet dari daftar.';
      var items = [];
      var els = f.querySelectorAll('.line');
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        var product = el.querySelector('.lp').value.trim();
        var qtyRaw = el.querySelector('.lq').value;
        var priceRaw = el.querySelector('.lr').value;
        if (!product && !qtyRaw && !priceRaw) continue; // baris kosong diabaikan
        var no = 'Produk ' + (i + 1) + ': ';
        var qty = parseInt(qtyRaw, 10);
        var price = parseInt(priceRaw, 10);
        if (!product || (!byName(d.products, product) && !known[product])) return no + 'pilih produk dari daftar.';
        if (!(qty > 0)) return no + 'qty harus lebih dari 0.';
        if (!(price >= 0)) return no + 'isi harga satuan.';
        var disc = pctNum(el.querySelector('.ld').value);
        var tax = pctNum(el.querySelector('.lt').value);
        if (isNaN(disc)) return no + 'Disc % harus antara 0 dan 100 (maksimal 2 angka desimal).';
        if (isNaN(tax)) return no + 'Pajak % harus antara 0 dan 100 (maksimal 2 angka desimal).';
        items.push({ product: product, qty: qty, price: price, disc: disc, tax: tax });
      }
      if (!items.length) return 'Isi minimal satu produk.';
      return call('saveNota', {
        nota: editing ? editing.nota : '', owner: owner(), date: v.date, outlet: outlet, note: v.note, items: items
      }).then(function () { state.month = v.date.slice(0, 7); });
    });

    if (editing) {
      state.onPending = function (data) {
        var note = $('syncnote');
        var msg = staleMessage(data);
        if (!note) return;
        note.textContent = msg;
        note.hidden = !msg;
      };
    }

    var box = form.querySelector('#lines');
    var alld = form.querySelector('#alld');
    var allt = form.querySelector('#allt');

    function attachLine(el) {
      combo(el.querySelector('.lp'), function () {
        return d.products.map(function (p) { return { value: p.name, sub: rp(p.price) }; });
      }, {
        empty: 'Produk tidak ditemukan. Tambahkan dulu di tab Produk.',
        next: function () { el.querySelector('.lq').focus(); }
      });
    }
    Array.prototype.forEach.call(box.querySelectorAll('.line'), attachLine);
    combo(form.elements.outlet, function () {
      return d.outlets.map(function (o) { return { value: o.name, sub: o.address || '' }; });
    }, {
      empty: 'Outlet tidak ditemukan. Tambahkan dulu di tab Outlet.',
      next: function () {
        var first = box.querySelector('.lp');
        if (first && !first.value) first.focus(); else form.elements.outlet.blur();
      }
    });

    // Isian "semua": tampilkan nilai bila semua baris sama, kosong + "Beda" bila berbeda.
    function uniform(sel) {
      var first = null;
      var inputs = box.querySelectorAll(sel);
      for (var i = 0; i < inputs.length; i++) {
        var n = pctNum(inputs[i].value);
        if (isNaN(n) || (i > 0 && n !== first)) return null;
        first = n;
      }
      return first > 0 ? fmtPct(first) : '';
    }
    function syncAll() {
      [[alld, '.ld'], [allt, '.lt']].forEach(function (p) {
        var u = uniform(p[1]);
        p[0].value = u === null ? '' : u;
        p[0].placeholder = u === null ? 'Beda' : '0';
      });
    }
    function refresh() {
      var tot = { sub: 0, disc: 0, tax: 0, total: 0 };
      var rows = box.querySelectorAll('.line');
      Array.prototype.forEach.call(rows, function (el, i) {
        el.querySelector('.ln').textContent = 'Produk ' + (i + 1);
        el.querySelector('.x').style.visibility = rows.length > 1 ? 'visible' : 'hidden';
        var qty = parseInt(el.querySelector('.lq').value, 10) || 0;
        var price = parseInt(el.querySelector('.lr').value, 10) || 0;
        var dp = pctNum(el.querySelector('.ld').value);
        var tp = pctNum(el.querySelector('.lt').value);
        var c = calc(qty, price, isNaN(dp) ? 0 : dp, isNaN(tp) ? 0 : tp);
        var parts = [];
        if (c.discAmt) parts.push('Diskon ' + fmtPct(dp) + '% −' + rp(c.discAmt));
        if (c.taxAmt) parts.push('Pajak ' + fmtPct(tp) + '% +' + rp(c.taxAmt));
        var adj = el.querySelector('.adj');
        adj.hidden = !parts.length;
        adj.textContent = parts.length ? rp(c.sub) + ' · ' + parts.join(' · ') : '';
        el.querySelector('.ls').textContent = rp(c.total);
        tot.sub += c.sub; tot.disc += c.discAmt; tot.tax += c.taxAmt; tot.total += c.total;
      });
      $('tsub').textContent = rp(tot.sub);
      $('tdr').hidden = !tot.disc;
      $('tdisc').textContent = '−' + rp(tot.disc);
      $('ttr').hidden = !tot.tax;
      $('ttax').textContent = '+' + rp(tot.tax);
      $('tot').textContent = rp(tot.total);
    }
    form.addEventListener('input', function (e) {
      var t = e.target;
      if (t.classList.contains('lq') || t.classList.contains('lr')) t.value = t.value.replace(/\D/g, '');
      if (t.classList.contains('ld') || t.classList.contains('lt')) {
        t.value = cleanPct(t.value);
        syncAll();
      }
      if (t === alld || t === allt) {
        t.value = cleanPct(t.value);
        t.placeholder = '0';
        var sel = t === alld ? '.ld' : '.lt';
        Array.prototype.forEach.call(box.querySelectorAll(sel), function (i) { i.value = t.value; });
      }
      if (t.classList.contains('lp')) {
        var p = byName(d.products, t.value.trim());
        if (p) t.closest('.line').querySelector('.lr').value = String(p.price);
      }
      refresh();
    });
    form.addEventListener('click', function (e) {
      var x = e.target.closest('.x');
      if (x) {
        x.closest('.line').remove();
        syncAll();
        refresh();
      } else if (e.target.id === 'addline') {
        box.insertAdjacentHTML('beforeend', lineHtml({ product: '', qty: '', price: '', disc: alld.value, tax: allt.value }));
        refresh();
        var last = box.lastElementChild;
        attachLine(last);
        last.scrollIntoView({ block: 'nearest' });
        last.querySelector('.lp').focus();
      }
    });
    // Enter di kolom isian tidak boleh langsung menyimpan: transaksi bisa masih setengah terisi.
    form.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.preventDefault();
    });
    syncAll();
    refresh();
  }

  function productForm(editing) {
    var p = editing || { name: '', price: '', unit: 'pcs' };
    var form = openModal(editing ? 'Ubah Produk' : 'Tambah Produk',
      '<label>Nama produk<input name="name" value="' + esc(p.name) + '"></label>' +
      '<label>Harga satuan<input name="price" inputmode="numeric" value="' + esc(p.price) + '"></label>' +
      '<label>Satuan (pcs, box, strip, ...)<input name="unit" value="' + esc(p.unit) + '"></label>',
      function (f) {
        var v = fv(f);
        if (!v.name.trim()) return 'Nama produk wajib diisi.';
        return call('saveProduct', {
          id: editing ? editing.id : '', name: v.name, price: parseInt(v.price, 10) || 0, unit: v.unit
        });
      });
    digitsOnly(form.elements.price);
  }

  function outletForm(editing) {
    var o = editing || { name: '', address: '' };
    openModal(editing ? 'Ubah Outlet' : 'Tambah Outlet',
      '<label>Nama outlet<input name="name" value="' + esc(o.name) + '"></label>' +
      '<label>Alamat (opsional)<input name="address" value="' + esc(o.address) + '"></label>',
      function (f) {
        var v = fv(f);
        if (!v.name.trim()) return 'Nama outlet wajib diisi.';
        return call('saveOutlet', { id: editing ? editing.id : '', name: v.name, address: v.address });
      });
  }

  // Produk yang diorder satu outlet pada bulan yang sedang dilihat, dihitung dari data nota yang sudah dimuat.
  function outletDetail(name) {
    var orders = state.data.notas.filter(function (n) { return n.outlet === name; });
    if (!orders.length) return;
    var map = Object.create(null);
    var prods = [];
    var total = 0;
    var qty = 0;
    var sum = { sub: 0, disc: 0, tax: 0 };
    orders.forEach(function (n) {
      total += n.total;
      qty += n.qty;
      var b = nb(n);
      sum.sub += b.sub; sum.disc += b.disc; sum.tax += b.tax;
      n.items.forEach(function (it) {
        var g = map[it.product];
        if (!g) { g = map[it.product] = { label: it.product, qty: 0, total: 0 }; prods.push(g); }
        g.qty += it.qty;
        g.total += it.total;
      });
    });
    prods.sort(function (a, b) { return b.total - a.total; });

    var history = orders.map(function (n) {
      return '<div class="card" style="padding:10px 12px">' +
        '<div style="display:flex;justify-content:space-between;gap:8px"><b>' + esc(fmtDate(n.date)) + '</b><b>' + rp(n.total) + '</b></div>' +
        '<ul class="lines">' + n.items.map(function (l) {
          return '<li><span>' + esc(l.product) + lineTag(l) + '</span><span>' + l.qty + ' × ' + rp(l.price) + '</span></li>';
        }).join('') + '</ul>' + brk(n) +
        (n.note ? '<div class="s" style="margin-top:4px;font-size:13px;color:var(--muted)">' + esc(n.note) + '</div>' : '') + '</div>';
    }).join('');

    openInfo(name,
      '<p class="help" style="margin-bottom:10px">' + esc(monthLabel(state.month)) + '</p>' +
      summaryCard({ total: total, transactions: orders.length, qty: qty, subtotal: sum.sub, discount: sum.disc, tax: sum.tax }) +
      '<h3>Produk yang diorder</h3>' + bars(prods) +
      '<h3>Riwayat order</h3>' + history,
      '<span class="dl-btns"><button type="button" class="btn ghost small" id="dlx">Excel</button>' +
      '<button type="button" class="btn ghost small" id="dlp">PDF</button></span>');
    $('dlx').onclick = function () { exportRecap('xlsx', name); };
    $('dlp').onclick = function () { exportRecap('pdf', name); };
  }

  /* ------------------------------------------------------------ unduh Excel / PDF */
  var scriptLoads = {};
  function loadScript(src) {
    if (!scriptLoads[src]) {
      scriptLoads[src] = new Promise(function (resolve, reject) {
        var el = document.createElement('script');
        el.src = src;
        el.onload = resolve;
        el.onerror = function () { delete scriptLoads[src]; reject(new Error('Tidak bisa memuat ' + src + '. Periksa koneksi lalu coba lagi.')); };
        document.head.appendChild(el);
      });
    }
    return scriptLoads[src];
  }
  function loadExport(kind) {
    var chain = loadScript('export.js');
    if (kind === 'pdf') {
      chain = chain.then(function () { return loadScript('vendor/jspdf.umd.min.js'); })
        .then(function () { return loadScript('vendor/jspdf.plugin.autotable.min.js'); });
    }
    return chain;
  }

  /** Data tabel untuk file: satu entri per outlet (atau hanya satu outlet), baris produk urut tanggal. */
  function buildExportModel(only) {
    var d = state.data;
    var byOutlet = Object.create(null);
    var order = [];
    d.notas.slice().reverse().forEach(function (n) {       // lama -> baru
      if (only && n.outlet !== only) return;
      var o = byOutlet[n.outlet];
      if (!o) { o = byOutlet[n.outlet] = { name: n.outlet, transactions: 0, qty: 0, sub: 0, disc: 0, tax: 0, total: 0, rows: [] }; order.push(o); }
      o.transactions++;
      n.items.forEach(function (l) {
        var c = calc(l.qty, l.price, l.disc || 0, l.tax || 0);
        o.rows.push({ date: n.date, dateLabel: fmtDate(n.date), product: l.product, qty: l.qty, price: l.price,
          disc: l.disc || 0, tax: l.tax || 0, sub: c.sub, discAmt: c.discAmt, taxAmt: c.taxAmt, total: c.total, note: n.note || '' });
        o.qty += l.qty; o.sub += c.sub; o.disc += c.discAmt; o.tax += c.taxAmt; o.total += c.total;
      });
    });
    order.sort(function (a, b) { return b.total - a.total || (a.name < b.name ? -1 : 1); });
    var g = { transactions: 0, qty: 0, sub: 0, disc: 0, tax: 0, total: 0 };
    order.forEach(function (o) { Object.keys(g).forEach(function (k) { g[k] += o[k]; }); });
    return {
      monthLabel: monthLabel(state.month), owner: owner(),
      printedAt: new Date().toLocaleString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
      outlets: order, grand: g
    };
  }

  function safeName(s) { return String(s).replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').slice(0, 40) || 'outlet'; }
  function saveBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 15000);
  }

  var exporting = false;
  /** kind: 'xlsx' | 'pdf'; only: nama satu outlet, atau null untuk semua outlet bulan yang sedang dilihat. */
  function exportRecap(kind, only) {
    if (!state.data || exporting) return Promise.resolve();
    var model = buildExportModel(only);
    if (!model.outlets.length) { toast('Belum ada penjualan di bulan ini.'); return Promise.resolve(); }
    exporting = true;
    toast(kind === 'pdf' ? 'Menyiapkan PDF…' : 'Menyiapkan Excel…');
    var name = 'Rekap-' + (only ? safeName(only) : 'Outlet') + '-' + state.month + (kind === 'pdf' ? '.pdf' : '.xlsx');
    return loadExport(kind).then(function () {
      return kind === 'pdf' ? window.RSExport.pdf(model) : window.RSExport.xlsx(model);
    }).then(function (blob) {
      saveBlob(blob, name);
      toast('File diunduh: ' + name);
    }).catch(function (e) {
      toast('Gagal membuat file: ' + e.message);
    }).then(function () { exporting = false; });
  }

  function openSetup(first) {
    var cfg = getCfg() || { url: '', token: '' };
    var connected = !!getCfg();
    var form = openModal(first ? 'Hubungkan ke Google Sheets' : 'Pengaturan',
      '<p class="help">Isi URL Web app Apps Script (berakhiran <b>/exec</b>) dan kode akses dari menu ' +
      '<b>Rekap Sales &gt; Buat kode akses baru</b> di Google Sheet Anda.</p>' +
      '<label>URL Web app<input name="url" inputmode="url" autocomplete="off" autocapitalize="off" value="' + esc(cfg.url) + '"></label>' +
      '<label>Kode akses<input name="token" type="password" autocomplete="off" value="' + esc(cfg.token) + '"></label>' +
      '<label>Nama sales (memisahkan data tiap HP)<input name="owner" maxlength="60" autocomplete="off" placeholder="Kosongkan untuk data lama / tanpa nama" value="' + esc(cfg.owner || '') + '"></label>' +
      '<p class="help">Penjualan yang Anda input hanya tampil di HP dengan nama yang <b>sama</b>. Beri nama berbeda di tiap HP ' +
      'supaya datanya tidak saling muncul. Produk dan outlet tetap dipakai bersama.</p>' +
      (connected ? '<button type="button" class="btn ghost" id="logout" style="color:var(--danger);padding-left:0">Putuskan sambungan</button>' : ''),
      function (f) {
        var v = fv(f);
        var url = v.url.trim();
        var token = v.token.trim();
        if (!/^https:\/\/script\.google\.com\/.+\/exec(\?.*)?$/.test(url)) {
          return 'URL harus alamat Web app Apps Script, berakhiran /exec.';
        }
        if (!token) return 'Kode akses wajib diisi.';
        var owner = v.owner.trim().slice(0, 60);
        var c = { url: url, token: token, owner: owner };
        return rawCall(c, 'load', [state.month, owner]).then(function () {
          var old = getCfg();
          if (!old || old.url !== url || (old.owner || '') !== owner) clearCache();
          setCfg(c);
          state.data = null;
          state.sig = '';
          state.shown = false;
        });
      }, 'Simpan');
    var out = form.querySelector('#logout');
    if (out) out.onclick = function () {
      if (!window.confirm('Putuskan sambungan? Data di Google Sheet tidak dihapus.')) return;
      clearCfg();
      clearCache();
      state.data = null; state.sig = ''; state.shown = false;
      closeModal();
      render();
    };
  }

  /* ------------------------------------------------------------ aksi */
  function runShortcut() {
    if (addShortcutDone) return;
    addShortcutDone = true;
    try {
      if (/(^|[?&])add=sale(&|$)/.test(location.search) && state.data && !modalOpen()) {
        state.tab = 'sales';
        render();
        saleForm();
        history.replaceState(null, '', location.pathname);
      }
    } catch (e) { /* abaikan */ }
  }

  document.addEventListener('click', function (e) {
    var tab = e.target.closest('[data-tab]');
    if (tab) { state.tab = tab.getAttribute('data-tab'); state.openProducts = false; render(); window.scrollTo(0, 0); return; }
    if (e.target.closest('#fab')) {
      if (!state.data) return;
      ({ sales: saleForm, products: productForm, outlets: outletForm }[state.tab] || function () {})();
      return;
    }
    var el = e.target.closest('[data-act]');
    if (!el || el.closest('#modal-root')) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    var d = state.data;
    if (act === 'prev' || act === 'next') {
      state.month = shiftMonth(state.month, act === 'next' ? 1 : -1);
      state.sig = '';
      reload();
    } else if (act === 'retry') { reload(); }
    else if (act === 'dl-xlsx' || act === 'dl-pdf') { exportRecap(act === 'dl-pdf' ? 'pdf' : 'xlsx', null); }
    else if (act === 'toggle-products') { state.openProducts = !state.openProducts; render(); }
    else if (act === 'refresh') { reload({ silent: !!d, manual: true }); }
    else if (act === 'settings') { openSetup(!getCfg()); }
    else if (act === 'install') {
      if (installEvt) { installEvt.prompt(); installEvt = null; renderTop(); }
    } else if (act === 'outlet-detail') { if (d) outletDetail(el.getAttribute('data-name')); }
    else if (!d) { return; }
    else if (act === 'edit-nota') { var n = byNota(d.notas, id); if (n) saleForm(n); }
    else if (act === 'edit-product') {
      var p = d.products.filter(function (x) { return x.id === id; })[0]; if (p) productForm(p);
    } else if (act === 'edit-outlet') {
      var o = d.outlets.filter(function (x) { return x.id === id; })[0]; if (o) outletForm(o);
    } else if (act === 'del-nota') {
      e.stopPropagation();
      var nn = byNota(d.notas, id);
      if (nn) confirmDelete('Hapus Penjualan',
        'Hapus penjualan <b>' + esc(nn.outlet) + '</b> tanggal ' + esc(fmtDate(nn.date)) + ' (' + nn.items.length +
        ' produk, ' + rp(nn.total) + ')? Tindakan ini tidak bisa dibatalkan.', function () { return call('deleteNota', id, owner()); });
    } else if (act === 'del-product') {
      e.stopPropagation();
      var pp = d.products.filter(function (x) { return x.id === id; })[0];
      if (pp) confirmDelete('Hapus Produk', 'Hapus produk <b>' + esc(pp.name) + '</b>? Penjualan lama tidak ikut terhapus.',
        function () { return call('deleteProduct', id); });
    } else if (act === 'del-outlet') {
      e.stopPropagation();
      var oo = d.outlets.filter(function (x) { return x.id === id; })[0];
      if (oo) confirmDelete('Hapus Outlet', 'Hapus outlet <b>' + esc(oo.name) + '</b>? Penjualan lama tidak ikut terhapus.',
        function () { return call('deleteOutlet', id); });
    }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.bar-row.tap')) {
      e.preventDefault();
      if (state.data) outletDetail(e.target.getAttribute('data-name'));
    }
  });

  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; renderTop(); });
  window.addEventListener('appinstalled', function () { installEvt = null; renderTop(); });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* mis. file:// — abaikan */ });
    });
  }

  render();
  if (getCfg()) reload(); else openSetup(true);
  startSync();
})();
</script>
</body>
</html>
